[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kmz2geoh5"
version = "0.2.0"
description = "Convert Google Earth KMZ files into Geoscience Analyst geoh5 workspaces."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Derek Kinakin" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "geopandas",
    "fiona",
    "pyproj",
    "pandas",
    "numpy",
    "geoh5py",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kmz2geoh5"]

[tool.hatch.envs.default]
python = "3.12"
dependencies = [
    "pytest",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
